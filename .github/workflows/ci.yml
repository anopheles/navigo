name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Debian's mpv (0.40) meets navigo's 0.38 minimum; Ubuntu 24.04's (0.37)
    # doesn't, and without mpv the player tests skip.
    container: golang:1.26
    steps:
      - uses: actions/checkout@v7
      - name: mpv for the player tests
        run: apt-get update && apt-get install -y --no-install-recommends mpv
      - name: gofmt, vet, test, licences
        run: tools/ci/check.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/navigo
