name: Homebrew

# Publishing a release (not a pre-release) writes its cask to
# anopheles/homebrew-tap. Drafts never reach the tap. Run it by hand with
# a tag to re-push or backfill a cask. docs/releasing.md has the details.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  cask:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: anopheles/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tap/Casks
          tools/release/cask.sh "$TAG" > tap/Casks/navigo.rb
      - name: Push to the tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/navigo.rb
          if git diff --cached --quiet; then echo "cask unchanged"; exit 0; fi
          git commit -m "navigo $TAG"
          git push
